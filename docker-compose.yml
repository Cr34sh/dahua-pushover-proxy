services:
  campush:
    build: .
    container_name: campush
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:?Define SECRET_KEY en el fichero .env}
      - FLASK_ENV=production
      - TZ=${TZ:-Europe/Madrid}

# Ajustes propios de cada despliegue (redes, IP fija, DNS...) van en
# docker-compose.override.yml, que no se versiona.
